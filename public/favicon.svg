  <rect x="32" y="28" width="8" height="5" fill="#1A3D2F" rx="0.5" />
  <rect x="42" y="28" width="8" height="5" fill="#1A3D2F" rx="0.5" />
  <rect x="32" y="36" width="8" height="5" fill="#1A3D2F" rx="0.5" />
  <rect x="42" y="36" width="8" height="5" fill="#1A3D2F" rx="0.5" />
  <rect x="32" y="44" width="8" height="6" fill="#1A3D2F" rx="0.5" />
  <rect x="42" y="44" width="8" height="6" fill="#1A3D2F" rx="0.5" />
  
  <!-- Left Wing Windows -->
  <rect x="19" y="28" width="8" height="4" fill="#1A3D2F" rx="0.5" />
  <rect x="19" y="35" width="8" height="4" fill="#1A3D2F" rx="0.5" />
  <rect x="19" y="42" width="8" height="4" fill="#1A3D2F" rx="0.5" />
  
